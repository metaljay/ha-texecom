name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the version matches the tag
        run: |
          version=$(python3 -c "import json;print(json.load(open('custom_components/texecom/manifest.json'))['version'])")
          [ "v$version" = "${{ github.event.release.tag_name }}" ] || { echo "manifest $version != tag ${{ github.event.release.tag_name }}"; exit 1; }
